[package]
name = "supacode-relay-rust-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
futures-util = "0.3"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.27"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
