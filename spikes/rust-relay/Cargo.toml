[package]
name = "relay-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = "0.30"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
