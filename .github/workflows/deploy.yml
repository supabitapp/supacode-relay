name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://supacode-relay.exe.xyz/
    env:
      ROUTER_HOST: supacode-relay.exe.xyz
      NODES: node-a node-b node-c
      HOST_KEY: ssh-rsa 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make build
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for host in "$ROUTER_HOST" $(printf 'supacode-relay-%s.exe.xyz ' $NODES); do
            printf '%s %s\n' "$host" "$HOST_KEY"
          done > ~/.ssh/known_hosts
      - name: Roll relay nodes
        run: |
          for node in $NODES; do
            host="supacode-relay-$node.exe.xyz"
            scp -o BatchMode=yes bin/relay deploy/supacode-relay-node.service "$host:/tmp/"
            ssh -o BatchMode=yes "$host" "bash -s -- $node" < deploy/install-node.sh
          done
      - name: Install router
        run: |
          scp -o BatchMode=yes bin/relay-router deploy/supacode-relay-router.service "$ROUTER_HOST:/tmp/"
          ssh -o BatchMode=yes "$ROUTER_HOST" 'bash -s' < deploy/install-router.sh
      - name: Smoke test through the public endpoint
        run: go run ./e2e/docker/probe -mode smoke -url "wss://$ROUTER_HOST" -n 6
