name: Deploy push gateway

on:
  push:
    branches: [main]
    paths:
      - cmd/push/**
      - internal/push/**
      - deploy/install-push.sh
      - deploy/supacode-push.service
      - deploy/supacode-push-tunnel.service
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
      - .github/workflows/deploy-push.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-push
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: depot-ubuntu-24.04
    environment:
      name: production
      url: https://push.supacode.sh/
    env:
      PUSH_HOST: supacode-relay.exe.xyz
      HOST_KEY: ssh-rsa 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build -trimpath -o bin/push ./cmd/push
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$PUSH_HOST" "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Install gateway
        run: |
          scp -o BatchMode=yes bin/push deploy/supacode-push.service deploy/supacode-push-tunnel.service "$PUSH_HOST:/tmp/"
          ssh -o BatchMode=yes "$PUSH_HOST" 'bash -s' < deploy/install-push.sh
      - name: Verify separate HTTPS ingress
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --max-time 10 https://push.supacode.sh/healthz
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST https://push.supacode.sh/v1/push/enroll -d '{}')
          test "$status" = 401
